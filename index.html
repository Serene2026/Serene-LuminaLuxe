  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: #3D3D3D;
      background: linear-gradient(135deg, #FDFCFB 0%, #f8f3eb 50%, #f3ede2 100%);
      background-attachment: fixed;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(139, 115, 85, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139, 115, 85, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(139, 115, 85, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }
    
    html {
      height: 100%;
      scroll-behavior: smooth;
    }
    
    * {
      box-sizing: border-box;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      line-height: 1.3;
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }
    
    .seasonal-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      color: white;
      z-index: 1001;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      font-size: 13px;
      font-weight: 500;
    }
    
    .seasonal-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }
    
    .seasonal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      min-width: fit-content;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .seasonal-icon {
      font-size: 16px;
    }
    
    .seasonal-swiper-container {
      flex: 1;
      max-width: 400px;
      overflow: hidden;
    }
    
    .seasonal-swiper {
      width: 100%;
    }
    
    .seasonal-swiper .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: auto;
      padding: 0;
    }
    
    .seasonal-swiper strong {
      white-space: normal;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .seasonal-features {
      display: flex;
      gap: 30px;
      flex: 1;
      justify-content: center;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    
    .feature-icon {
      font-size: 14px;
    }
    
    .feature-text {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.95;
    }
    
    .seasonal-chevron {
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.3s ease;
      min-width: fit-content;
    }
    
    .seasonal-chevron:hover {
      transform: translateX(3px);
    }
    
    .main-content {
      margin-top: 120px;
    }
    
    
    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      color: #8B7355;
      letter-spacing: 2px;
      text-decoration: none;
    }
    
    .nav-menu {
      display: flex;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
      align-items: center;
    }
    
    .nav-menu a {
      text-decoration: none;
      color: #3D3D3D;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      position: relative;
    }
    
    .nav-menu a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 1px;
      background: #8B7355;
      transition: width 0.3s ease;
    }
    
    .nav-menu a:hover {
      color: #8B7355;
    }
    
    .nav-menu a:hover::after {
      width: 100%;
    }
    
    .cart-icon {
      position: relative;
      background: #8B7355;
      color: white;
      padding: 12px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .cart-icon:hover {
      background: #A68968;
      transform: translateY(-2px);
    }
    
    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #E74C3C;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }
    
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: #3D3D3D;
      cursor: pointer;
      padding: 8px;
      min-height: 44px;
      min-width: 44px;
    }
    
    /* Main Content */
    .main-content {
      margin-top: 120px;
      min-height: calc(100% - 120px);
    }
    
    #home-page {
      padding-top: 0 !important;
      padding-bottom: 40px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    
    /* Page Sections */
    .page-section {
      display: none;
      padding: 80px 60px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .page-section.active {
      display: block;
    }
    
    /* Hero Section */
    .hero {
      background: linear-gradient(rgba(139, 115, 85, 0.85) 0%, rgba(166, 137, 104, 0.85) 100%),
                  url('https://images.unsplash.com/photo-1602874801006-e7d7a9e9c1f5?w=1920&q=80') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 120px 40px 80px;
      margin: 0 0 60px 0;
      margin-top: 0;
      width: 100%;
      box-sizing: border-box;
    }
    
    .hero-content h1 {
      font-size: 64px;
      margin: 0 0 20px 0;
      font-weight: 300;
      letter-spacing: 3px;
    }
    
    .hero-content p {
      font-size: 20px;
      margin-bottom: 40px;
      opacity: 0.95;
      font-weight: 300;
    }
    
    .btn-primary {
      display: inline-block;
      padding: 16px 40px;
      background: white;
      color: #8B7355;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid white;
      transition: all 0.4s ease;
      cursor: pointer;
      border-radius: 0;
    }

    .btn-primary:hover {
      background: transparent;
      border-color: white;
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
      color: white !important;
      transform: translateY(-3px);
    }

    .contact-form .btn-primary {
      width: 100%;
      background: #8B7355;
      color: white;
      border: 2px solid #8B7355;
      border-radius: 8px;
      padding: 16px 40px;
      margin-top: 10px;
    }

    .contact-form .btn-primary:hover {
      background: #A68968;
      border-color: #A68968;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 115, 85, 0.2);
    }

    /* Ensure all button text is readable */
    button {
      font-weight: 500;
    }

    /* Bank modal buttons styling */
    .bank-modal .btn-primary {
      color: inherit !important;
      font-weight: 600;
    }

    .bank-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 2300;
      padding: 20px;
      overflow-y: auto;
    }

    .bank-card {
      width: 92%;
      max-width: 760px; /* enlarged modal */
      background: white;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25);
      padding: 36px;
    }

    /* Bank modal title + description */
    .bank-card .bank-modal-title {
      font-size: 28px;
      color: #8B7355;
      margin: 0 0 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .bank-card .bank-modal-desc {
      color: #666;
      font-size: 16px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    /* Bank list layout */
    .bank-details {
      flex: 1;
    }

    .bank-meta div {
      display: block;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .bank-meta strong {
      display: inline;
      margin-right: 4px;
    }
    
    .bank-meta {
      white-space: nowrap;
    }

    .bank-list {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .bank-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .bank-list .bank-item {
      display:flex;
      gap:20px;
      align-items:flex-start;
      border:1px solid #f0f0f0;
      padding:20px;
      border-radius:10px;
      background:#fafafa;
      min-height:110px;
    }

    .bank-list .bank-logo {
      width:72px;
      height:72px;
      object-fit:contain;
      flex-shrink:0;
      background:#fff;
      padding:8px;
      border-radius:8px;
    }

    .bank-list .bank-name {
      font-weight:600;
      color:#8B7355;
      font-size:16px;
      margin-bottom:8px;
    }

    .bank-list .bank-meta { 
      font-size:14px; 
      color:#666; 
    }

    /* ========== ENHANCED MOBILE RESPONSIVE STYLES ========== */
    
    /* ========== TABLET & MOBILE (768px and below) ========== */
    @media (max-width: 768px) {
      /* Header & Navigation */
      .header {
        top: 40px;
        padding: 0;
      }

      .header-container {
        padding: 12px 15px;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }

      .logo {
        font-size: 22px;
        letter-spacing: 1px;
      }

      .nav-menu {
        display: none;
        gap: 0;
        flex-wrap: wrap;
      }

      .nav-menu.mobile-open {
        display: flex;
        position: fixed;
        top: 80px;
        left: 0;
        right: 0;
        background: white;
        flex-direction: column;
        padding: 15px 0;
        gap: 0;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        z-index: 998;
        max-height: calc(100vh - 80px);
        overflow-y: auto;
      }

      .nav-menu.mobile-open li {
        list-style: none;
        width: 100%;
      }

      .nav-menu.mobile-open a {
        display: block;
        padding: 12px 20px;
        font-size: 13px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #f0f0f0;
      }

      .nav-menu.mobile-open a::after {
        display: none;
      }

      .mobile-menu-toggle {
        display: block;
      }

      /* Seasonal Bar - Responsive */
      .seasonal-content {
        padding: 8px 15px;
        flex-direction: row;
        gap: 10px;
        justify-content: space-between;
      }

      .seasonal-title {
        width: auto;
        justify-content: flex-start;
        min-width: auto;
        font-size: 11px;
      }

      .seasonal-features {
        display: none;
      }

      .seasonal-swiper-container {
        flex: 1;
        max-width: none;
      }

      .seasonal-swiper {
        width: 100%;
      }

      /* Hero Section - Mobile Optimized */
      .hero {
        padding: 70px 15px 50px;
        margin-bottom: 20px;
        background-size: cover;
      }

      .hero-content h1 {
        font-size: 32px;
        margin-bottom: 12px;
        letter-spacing: 1px;
      }

      .hero-content p {
        font-size: 14px;
        margin-bottom: 20px;
      }

      /* Main Content */
      .main-content {
        margin-top: 100px;
      }

      .page-section {
        padding: 30px 15px;
        margin: 0 auto;
      }

      /* Section Titles */
      .section-title {
        font-size: 28px;
        margin-bottom: 20px;
      }

      /* Category Showcase - Mobile Grid */
      .category-showcase {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 0;
        padding: 0;
      }

      .category-card {
        border-radius: 8px;
      }

      .category-card-image {
        height: 140px;
        object-fit: cover;
      }

      .category-card-content {
        padding: 12px;
      }

      .category-card-title {
        font-size: 14px;
        margin: 0;
      }

      .category-card-description {
        display: none;
      }

      /* Filter Buttons */
      .filter-buttons {
        gap: 8px;
        margin-bottom: 20px;
        display: flex;
        overflow-x: auto;
        padding: 0 15px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .filter-btn {
        padding: 8px 16px;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
        min-height: 36px;
      }

      /* Products Grid - Mobile First (2 Columns) */
      .products-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 30px;
        padding: 0;
      }

      .product-card {
        border-radius: 8px;
        overflow: hidden;
      }

      .product-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 14px;
        margin-bottom: 4px;
        font-weight: 500;
      }

      .product-category {
        font-size: 10px;
        margin-bottom: 6px;
        color: #999;
      }

      .product-description {
        display: none;
      }

      .product-price {
        font-size: 16px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .product-badge {
        font-size: 10px;
        padding: 3px 6px;
      }

      .btn-add-cart {
        padding: 10px;
        font-size: 11px;
        min-height: 40px;
      }

      /* Swiper Pagination Mobile */
      .swiper-pagination {
        bottom: 10px !important;
      }

      .swiper-pagination-bullet {
        width: 6px;
        height: 6px;
      }

      /* Cart Page Mobile */
      .cart-items {
        margin-bottom: 20px;
      }

      .cart-item {
        flex-direction: row;
        text-align: left;
        padding: 12px;
        gap: 12px;
        align-items: flex-start;
      }

      .cart-item-image {
        width: 70px;
        height: 70px;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: 6px;
      }

      .cart-item-info {
        flex: 1;
      }

      .cart-item-name {
        font-size: 14px;
        font-weight: 500;
      }

      .quantity-controls {
        margin-top: 8px;
        gap: 8px;
        display: flex;
      }

      .cart-summary {
        max-width: 100%;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 8px;
      }

      /* Buttons - Touch Friendly */
      .btn-primary {
        padding: 12px 24px;
        font-size: 12px;
        min-height: 44px;
      }

      .checkout-btn {
        min-height: 48px;
        font-size: 14px;
      }

      /* Bank Modal Mobile */
      .bank-modal {
        padding: 15px;
      }

      .bank-card {
        width: 100%;
        padding: 20px;
        border-radius: 12px;
      }

      .bank-list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .bank-list .bank-item {
        flex-direction: row;
        text-align: left;
        min-height: auto;
        padding: 15px;
        gap: 12px;
      }

      .bank-list .bank-logo {
        width: 50px;
        height: 50px;
      }

      .bank-meta {
        white-space: normal;
        font-size: 12px;
      }

      /* About/Vision/Mission Mobile */
      .vision-mission-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .vision-mission-card {
        padding: 20px;
        border-radius: 8px;
      }

      .vision-mission-title {
        font-size: 24px;
        margin-bottom: 25px;
      }

      .vision-mission-card h3 {
        font-size: 18px;
      }

      /* Founder Section Mobile */
      .founder-content {
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: center;
      }

      .founder-image {
        width: 100%;
        height: 300px;
        max-width: 280px;
        margin: 0 auto;
        object-fit: cover;
        border-radius: 8px;
      }

      .founder-text h3 {
        font-size: 20px;
      }

      /* Contact Form Mobile */
      .contact-form {
        max-width: 100%;
        padding: 0;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group input,
      .form-group textarea {
        padding: 12px;
        font-size: 16px;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      /* Footer Mobile */
      .footer-content {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 30px 15px 30px;
      }

      .footer-section h4 {
        font-size: 14px;
        margin-bottom: 10px;
      }

      .footer-section p,
      .footer-section a {
        font-size: 12px;
        line-height: 1.8;
      }

      /* Founder Section Small */

      }

    }

    /* ========== TABLET DEVICES (481px - 1024px) ========== */
    @media (min-width: 481px) and (max-width: 1024px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .category-showcase {
        grid-template-columns: repeat(2, 1fr);

      }

        padding: 40px 25px;
      }

      .hero {
        padding: 90px 25px 60px;
      }
    }

    /* ========== LANDSCAPE ORIENTATION (max-width: 768px) ========== */
    @media (max-width: 768px) and (orientation: landscape) {
      .hero {
        padding: 50px 25px 40px;
      }

      .hero-content h1 {
        font-size: 28px;
      }

      .header {
        top: 35px;
      }

      .seasonal-bar {
        display: none;
      }

      .main-content {
        margin-top: 85px;

        grid-template-columns: repeat(3, 1fr);

      }

      .category-showcase {

        gap: 15px;
      }

      .product-image {
        height: 160px;
      }

      .category-card-image {
        height: 130px;
      }
    }

    /* ========== TOUCH-FRIENDLY ELEMENTS ========== */
    @media (hover: none) and (pointer: coarse) {
      /* Increase tap targets to 44x44px minimum */
      .btn-primary,
      .btn-add-cart,
      .checkout-btn,
      .filter-btn,
      .cart-icon,
      .qty-btn,
      .mobile-menu-toggle {
        min-height: 44px;
        min-width: 44px;
      }

      /* Remove hover effects on touch devices */
      .product-card:hover {
        transform: none;
      }

      .category-card:hover {
        transform: none;
      }

      /* Add active states for better feedback */
      .product-card:active {
        transform: scale(0.98);
      }

      .category-card:active {
        transform: scale(0.98);
      }

      .btn-add-cart:active {
        background: #9a7f63;
        transform: scale(0.95);
      }
    }

    /* ========== IMAGE OPTIMIZATION ========== */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ========== BOX SIZING ========== */
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
    }

    /* ========== TEXT ADJUSTMENT ========== */
    html {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    /* ========== ACCESSIBILITY ========== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ========== PRINT STYLES ========== */
    @media print {
      .header,
      .seasonal-bar,
      .mobile-nav-bar,
      .footer {
        display: none;
      }

      body {
        margin: 0;
        padding: 0;
      }
    }
